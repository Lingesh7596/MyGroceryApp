<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sri Lakshmi Grocery Shop</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #2e7d32;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .shop-info {
      background: white;
      padding: 15px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 15px;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      box-sizing: border-box;
      font-size: 16px;
    }

    .product, .cart {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
    }

    button {
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }

    .remove {
      background: #c62828;
    }

    .whatsapp {
      background: #25D366;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>🛒 Sri Lakshmi Grocery Shop</h1>
  <p>Quality groceries at your doorstep</p>
</header>

<div class="shop-info">
  <p>📍 Main Road, Your Town</p>
  <p>🕒 8:00 AM - 9:00 PM</p>
</div>

<div class="container">

  <input
    type="text"
    id="search"
    placeholder="🔎 Search for a product..."
    oninput="showProducts()"
  >

  <h2>🛍️ Products</h2>

  <div id="products"></div>

  <h2>🛒 Your Cart</h2>

  <div class="cart">
    <div id="cartItems">Your cart is empty.</div>

    <p class="total">
      Total: ₹<span id="total">0</span>
    </p>

    <button class="remove" onclick="clearCart()">
      🗑️ Clear Cart
    </button>

    <select id="deliveryOption">
      <option>🏠 Home Delivery</option>
      <option>🏪 Store Pickup</option>
    </select>

    <button class="whatsapp" onclick="sendWhatsApp()">
      📱 Order on WhatsApp
    </button>
  </div>

</div>

<script>

let products = [
  { id: 1, name: "Rice", price: 60, emoji: "🍚" },
  { id: 2, name: "Sugar", price: 45, emoji: "🍬" },
  { id: 3, name: "Toor Dal", price: 120, emoji: "🫘" }
];

let cart = [];

function showProducts() {

  let searchText =
    document.getElementById("search").value.toLowerCase();

  let productBox =
    document.getElementById("products");

  productBox.innerHTML = "";

  let filteredProducts = products.filter(function(product) {
    return product.name.toLowerCase().includes(searchText);
  });

  filteredProducts.forEach(function(product) {

    productBox.innerHTML += `
      <div class="product">
        <h3>${product.emoji} ${product.name}</h3>
        <p>₹${product.price}</p>

        <button onclick="addToCart(${product.id})">
          ➕ Add to Cart
        </button>
      </div>
    `;
  });
}

function addToCart(id) {

  let item = cart.find(function(product) {
    return product.id === id;
  });

  if (item) {
    item.quantity++;
  } else {
    let product = products.find(function(product) {
      return product.id === id;
    });

    cart.push({
      id: product.id,
      name: product.name,
      price: product.price,
      quantity: 1
    });
  }

  showCart();
}

function changeQuantity(id, amount) {

  let item = cart.find(function(product) {
    return product.id === id;
  });

  if (!item) return;

  item.quantity += amount;

  if (item.quantity <= 0) {
    cart = cart.filter(function(product) {
      return product.id !== id;
    });
  }

  showCart();
}

function showCart() {

  let cartBox =
    document.getElementById("cartItems");

  let total = 0;

  if (cart.length === 0) {
    cartBox.innerHTML = "Your cart is empty.";
    document.getElementById("total").innerText = "0";
    return;
  }

  cartBox.innerHTML = "";

  cart.forEach(function(item) {

    let itemTotal = item.price * item.quantity;

    total += itemTotal;

    cartBox.innerHTML += `
      <div>
        <b>${item.name}</b>
        <br>
        ₹${item.price} × ${item.quantity}
        = ₹${itemTotal}

        <br>

        <button onclick="changeQuantity(${item.id}, -1)">
          −
        </button>

        <button onclick="changeQuantity(${item.id}, 1)">
          +
        </button>
      </div>
      <hr>
    `;
  });

  document.getElementById("total").innerText = total;
}

function clearCart() {

  cart = [];

  showCart();
}

function sendWhatsApp() {

  if (cart.length === 0) {
    alert("Please add some products first.");
    return;
  }

  let delivery =
    document.getElementById("deliveryOption").value;

  let message = "🛒 Grocery Order\n\n";

  let total = 0;

  cart.forEach(function(item) {

    let itemTotal = item.price * item.quantity;

    total += itemTotal;

    message +=
      item.name +
      " × " +
      item.quantity +
      " = ₹" +
      itemTotal +
      "\n";
  });

  message +=
    "\nTotal: ₹" +
    total +
    "\nDelivery: " +
    delivery;

  /*
    IMPORTANT:
    Put your uncle's WhatsApp number here.
    Use country code + number, without + or spaces.
  */

  let phone = "YOUR_PHONE_NUMBER";

  window.open(
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(message),
    "_blank"
  );
}

showProducts();
showCart();

</script>

</body>
</html>
