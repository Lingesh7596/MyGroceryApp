<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sri Lakshmi Grocery Shop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f8f6;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #1b5e20, #43a047);
      color: white;
      padding: 28px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 15px;
    }

    .shop-info {
      background: white;
      padding: 14px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 18px;
    }

    .search-box {
      background: white;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    input,
    select,
    button {
      width: 100%;
      padding: 13px;
      margin: 6px 0;
      border-radius: 9px;
      font-size: 16px;
    }

    input,
    select {
      border: 1px solid #ddd;
      background: white;
    }

    h2 {
      margin-top: 25px;
    }

    .product {
      background: white;
      padding: 18px;
      margin: 12px 0;
      border-radius: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .product h3 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    button {
      border: none;
      background: #2e7d32;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .cart {
      background: white;
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .cart-item {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .quantity-buttons {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .quantity-buttons button {
      width: 50px;
      padding: 8px;
    }

    .clear {
      background: #c62828;
    }

    .whatsapp {
      background: #25D366;
      font-size: 17px;
      padding: 15px;
    }

    .total {
      font-size: 21px;
      font-weight: bold;
      margin: 18px 0;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>🛒 Sri Lakshmi Grocery Shop</h1>
  <p>Fresh groceries • Easy ordering • Friendly service</p>
</header>

<div class="shop-info">
  <div>📍 Main Road, Your Town</div>
  <div>🕒 8:00 AM - 9:00 PM</div>
</div>

<div class="container">

  <div class="search-box">
    <input
      type="text"
      id="search"
      placeholder="🔎 Search groceries..."
      oninput="showProducts()"
    >
  </div>

  <h2>🛍️ Our Products</h2>

  <div id="products"></div>

  <h2>🛒 Your Cart</h2>

  <div class="cart">

    <div id="cartItems">
      Your cart is empty.
    </div>

    <div class="total">
      Total: ₹<span id="total">0</span>
    </div>

    <button class="clear" onclick="clearCart()">
      🗑️ Clear Cart
    </button>

    <select id="deliveryOption">
      <option>🏠 Home Delivery</option>
      <option>🏪 Store Pickup</option>
    </select>

    <button class="whatsapp" onclick="sendWhatsApp()">
      📱 Order on WhatsApp
    </button>

  </div>

</div>

<footer>
  Thank you for shopping with us! ❤️
</footer>

<script>

let products = [
  { id: 1, name: "Rice", price: 60, emoji: "🍚" },
  { id: 2, name: "Sugar", price: 45, emoji: "🍬" },
  { id: 3, name: "Toor Dal", price: 120, emoji: "🫘" }
];

let cart = [];

function showProducts() {

  let searchText =
    document.getElementById("search").value.toLowerCase();

  let productBox =
    document.getElementById("products");

  productBox.innerHTML = "";

  let filteredProducts = products.filter(function(product) {
    return product.name.toLowerCase().includes(searchText);
  });

  filteredProducts.forEach(function(product) {

    productBox.innerHTML += `
      <div class="product">

        <h3>${product.emoji} ${product.name}</h3>

        <div class="price">
          ₹${product.price}
        </div>

        <button onclick="addToCart(${product.id})">
          ➕ Add to Cart
        </button>

      </div>
    `;
  });
}

function addToCart(id) {

  let item = cart.find(function(product) {
    return product.id === id;
  });

  if (item) {

    item.quantity++;

  } else {

    let product = products.find(function(product) {
      return product.id === id;
    });

    cart.push({
      id: product.id,
      name: product.name,
      price: product.price,
      quantity: 1
    });
  }

  showCart();
}

function changeQuantity(id, amount) {

  let item = cart.find(function(product) {
    return product.id === id;
  });

  if (!item) return;

  item.quantity += amount;

  if (item.quantity <= 0) {

    cart = cart.filter(function(product) {
      return product.id !== id;
    });
  }

  showCart();
}

function showCart() {

  let cartBox =
    document.getElementById("cartItems");

  let total = 0;

  if (cart.length === 0) {

    cartBox.innerHTML = "Your cart is empty.";

    document.getElementById("total").innerText = "0";

    return;
  }

  cartBox.innerHTML = "";

  cart.forEach(function(item) {

    let itemTotal =
      item.price * item.quantity;

    total += itemTotal;

    cartBox.innerHTML += `

      <div class="cart-item">

        <b>${item.name}</b>

        <br>

        ₹${item.price} × ${item.quantity}
        = ₹${itemTotal}

        <div class="quantity-buttons">

          <button onclick="changeQuantity(${item.id}, -1)">
            −
          </button>

          <button onclick="changeQuantity(${item.id}, 1)">
            +
          </button>

        </div>

      </div>
    `;
  });

  document.getElementById("total").innerText = total;
}

function clearCart() {

  cart = [];

  showCart();
}

function sendWhatsApp() {

  if (cart.length === 0) {

    alert("Please add some products first.");

    return;
  }

  let delivery =
    document.getElementById("deliveryOption").value;

  let message =
    "🛒 Grocery Order\n\n";

  let total = 0;

  cart.forEach(function(item) {

    let itemTotal =
      item.price * item.quantity;

    total += itemTotal;

    message +=
      item.name +
      " × " +
      item.quantity +
      " = ₹" +
      itemTotal +
      "\n";
  });

  message +=
    "\nTotal: ₹" +
    total +
    "\nDelivery: " +
    delivery;

  let phone = "YOUR_PHONE_NUMBER";

  window.open(
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(message),
    "_blank"
  );
}

showProducts();

showCart();

</script>

</body>
</html>
