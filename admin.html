<!DOCTYPE html>
<html>
<head>
  <title>Grocery Admin</title>
</head>
<body>
<h1>🛒 Grocery Admin</h1>
<div>
  <input id="email" type="email" placeholder="Admin email">
  <input id="password" type="password" placeholder="Admin password">
  <button onclick="login()">Login</button>
</div>

<h2>Add Product</h2>

<input id="name" placeholder="Product name">
<input id="price" type="number" placeholder="Price">
<input id="emoji" placeholder="Emoji">
<button onclick="addProduct()">Add Product</button>

<h2>Products</h2>
<div id="products"></div>
<script>
async function addProduct() {
  const name = document.getElementById("name").value.trim();
  const price = Number(document.getElementById("price").value);
  const emoji = document.getElementById("emoji").value.trim();

  if (!name || !price) {
    alert("Please enter product name and price.");
    return;
  }

  const productRef = push(ref(db, "products"));

  await set(productRef, {
    name: name,
    price: price,
    emoji: emoji || "🛒"
  });

  alert("Product saved online!");

  document.getElementById("name").value = "";
  document.getElementById("price").value = "";
  document.getElementById("emoji").value = "";
}
</script>

<script type="module">
import {
  getAuth,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
 import { ref, push, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDChsXFu_Mix3LntFHVwrB8l_v4HNYEBjQ",
    authDomain: "my-grocery-app-695a8.firebaseapp.com",
    databaseURL: "https://my-grocery-app-695a8-default-rtdb.firebaseio.com",
    projectId: "my-grocery-app-695a8",
    storageBucket: "my-grocery-app-695a8.firebasestorage.app",
    messagingSenderId: "530240974462",
    appId: "1:530240974462:web:08b9794a1a6cacfa05722f",
    measurementId: "G-10BFY4L242"
  };
const db = getDatabase(initializeApp(firebaseConfig));
const auth = getAuth();
async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    alert("Login successful!");
  } catch (error) {
    alert("Login failed. Please check your details.");
  }
}
</script>
</body>
</html>
